[project]
name = "online-cinema-fast-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Nik",email = "nikita.pitushkin31@mail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (<4.1)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "stripe (>=16.0.0,<17.0.0)",
    "fastapi (>=0.161.0,<0.162.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry]
package-mode = false

[tool.coverage.run]
omit = ["tests/*", "alembic/*"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"